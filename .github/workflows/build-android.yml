name: Build Android APK

on:
  push:
    branches: [ "main", "001-moon-player" ]
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Web Assets
        run: npm run build
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonplayer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Create/Update Latest Development Release (Branch Push)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          body: |
            This release is automatically updated on every push to the codebase.
            
            **Latest Commit**: ${{ github.sha }}
            **Commit Message**: ${{ github.event.head_commit.message }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true

      - name: Create GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
