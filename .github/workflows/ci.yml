name: CI Pipeline

on:
  push:
    branches: [ "main", "001-moon-player" ]
  pull_request:
    branches: [ "main", "001-moon-player" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Linter
        run: npm run lint
